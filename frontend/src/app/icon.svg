<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Teal gradient matching the Z design -->
    <linearGradient id="logoTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    
    <!-- Deep blue gradient for the left side of the hexagon -->
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Hexagon background -->
  <!-- Left half (Dark Blue) -->
  <path d="M 50,5 L 10,28 L 10,72 L 50,95 Z" fill="url(#logoBlue)" />
  <!-- Right half (Medium slate-blue/grey) -->
  <path d="M 50,5 L 90,28 L 90,72 L 50,95 Z" fill="#1e293b" />
  <!-- Overlay for shading -->
  <path d="M 50,5 L 90,28 L 90,72 L 50,95 Z" fill="#ffffff" fill-opacity="0.05" />
  
  <!-- Hexagon border -->
  <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Vertical bars (H monogram details) in the background -->
  <line x1="56" y1="20" x2="56" y2="80" stroke="#64748b" stroke-width="4.5" stroke-linecap="round" />
  <line x1="66" y1="28" x2="66" y2="72" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
  <line x1="76" y1="36" x2="76" y2="64" stroke="#334155" stroke-width="4.5" stroke-linecap="round" />

  <!-- Stylized Z Monogram in the foreground -->
  <!-- We use a path with stroke-linejoin="miter" and stroke-linecap="square" to get clean, sharp edges -->
  <path d="M 24,32 L 72,32 L 32,68 L 68,68" fill="none" stroke="url(#logoTeal)" stroke-width="9.5" stroke-linecap="square" stroke-linejoin="miter" />
</svg>
